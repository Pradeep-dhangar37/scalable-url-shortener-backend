version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --save 60 1 --loglevel warning

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    restart: always
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    environment:
      ZOO_MY_ID: 1

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "${BACKEND_EXTERNAL_PORT}:3000"
    environment:
      - PORT=3000
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - ZOOKEEPER_URL=${ZOOKEEPER_URL}
      - BASE_URL=${BASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - RATE_LIMIT_AUTH_CAPACITY=${RATE_LIMIT_AUTH_CAPACITY}
      - RATE_LIMIT_AUTH_REFILL_RATE=${RATE_LIMIT_AUTH_REFILL_RATE}
      - RATE_LIMIT_SHORTEN_CAPACITY=${RATE_LIMIT_SHORTEN_CAPACITY}
      - RATE_LIMIT_SHORTEN_REFILL_RATE=${RATE_LIMIT_SHORTEN_REFILL_RATE}
      - RATE_LIMIT_STATS_CAPACITY=${RATE_LIMIT_STATS_CAPACITY}
      - RATE_LIMIT_STATS_REFILL_RATE=${RATE_LIMIT_STATS_REFILL_RATE}
      - RATE_LIMIT_REDIRECT_CAPACITY=${RATE_LIMIT_REDIRECT_CAPACITY}
      - RATE_LIMIT_REDIRECT_REFILL_RATE=${RATE_LIMIT_REDIRECT_REFILL_RATE}
    depends_on:
      - mongodb
      - redis
      - zookeeper

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: frontend
    restart: always
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:3001"
    depends_on:
      - backend

volumes:
  mongo_data:
